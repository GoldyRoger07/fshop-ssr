<button
    [type]="type()"
    class="flex w-full items-center justify-center rounded-lg px-4 py-2 text-sm font-medium"
    [class.btn-fill]="v() !== 2"
    [class.btn-fill-v2]="v() === 2"
    [class.btn-fill-white]="variant() === 'white'"
    [style]="styleVars()"
>
    <ng-content></ng-content>
</button>
