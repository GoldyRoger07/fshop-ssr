<div class="grid h-48 gap-2 sm:h-60 lg:grid-cols-[1fr_2fr_1fr]">
  <!-- Tuiles de gauche -->
  <ul class="hidden flex-col justify-between gap-2 lg:flex">
    @for (tile of sideTiles; track tile.label) {
      <li class="flex-1">
        <a
          [routerLink]="tile.link"
          [queryParams]="tile.params"
          class="flex h-full items-center overflow-hidden rounded bg-cover bg-center transition hover:opacity-90"
          [style.background-image]="'url(' + tile.image + ')'"
        >
          <span class="w-3/4 bg-linear-to-r from-black to-transparent px-5 py-1 font-bold text-white">
            {{ tile.label }}
          </span>
        </a>
      </li>
    }
  </ul>

  <!-- Carrousel principal -->
  <div class="hero-slider group relative h-full overflow-hidden rounded">
    <swiper-container
      #swiper
      loop="true"
      centered-slides="true"
      space-between="30"
      pagination="true"
      pagination-clickable="true"
      autoplay-delay="3500"
      autoplay-disable-on-interaction="false"
    >
      @for (slide of slides; track $index) {
        <swiper-slide>
          <a routerLink="/promos" class="block h-full">
            <img [src]="slide" [attr.loading]="$first ? 'eager' : 'lazy'" alt="Offres du moment" />
          </a>
        </swiper-slide>
      }
    </swiper-container>

    <button type="button" class="carousel-nav left-3" aria-label="Visuel précédent" (click)="prev(swiper)">
      <i class="pi pi-angle-left"></i>
    </button>
    <button type="button" class="carousel-nav right-3" aria-label="Visuel suivant" (click)="next(swiper)">
      <i class="pi pi-angle-right"></i>
    </button>
  </div>

  <!-- Tuiles marques -->
  <ul class="hidden flex-col justify-between gap-2 lg:flex">
    @for (tile of brandTiles; track tile.label) {
      <li class="flex-1">
        <a
          [routerLink]="tile.link"
          class="flex h-full items-center justify-center overflow-hidden rounded bg-cover bg-center text-xl font-bold text-white transition hover:opacity-90"
          [style.background-image]="'linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url(' + tile.image + ')'"
        >
          {{ tile.label }}
        </a>
      </li>
    }
  </ul>
</div>
